<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>批量投递</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="seal">投</span>
      <div>
        <h1>批量投递</h1>
        <p>应届生、猎聘、BOSS直聘</p>
      </div>
    </header>
    <button id="toggle" type="button">打开页面上的勾选面板</button>
    <ol>
      <li>用你自己的账号登录对应网站。</li>
      <li>打开职位搜索、推荐列表，或猎聘应聘记录。</li>
      <li>在左侧面板里筛选标题、勾选岗位。</li>
      <li>点「投递已勾选」。已申请的会跳过。</li>
    </ol>
    <p id="message"></p>
    <script src="popup.js"></script>
  </body>
</html>
