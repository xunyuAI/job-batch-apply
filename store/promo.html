<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>批量投递宣传图</title>
    <style>
      html,
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
        background: #f3eadc;
        color: #221c16;
        font-family: "Songti SC", "STSong", "PingFang SC", serif;
      }
      .board {
        box-sizing: border-box;
        width: 440px;
        height: 280px;
        padding: 28px 32px;
        background:
          linear-gradient(180deg, rgba(255, 252, 247, 0.55), transparent 120px),
          #f3eadc;
      }
      .seal {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 2px solid #be3a2b;
        border-radius: 4px;
        color: #be3a2b;
        font-size: 22px;
        font-weight: 700;
        transform: rotate(-8deg);
      }
      h1 {
        margin: 18px 0 0;
        font-size: 40px;
        letter-spacing: 0.08em;
      }
      p {
        margin: 10px 0 0;
        color: #6f655c;
        font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="board">
      <div class="seal">投</div>
      <h1>批量投递</h1>
      <p>先勾选职位标题，再点击申请或沟通。</p>
    </div>
  </body>
</html>
